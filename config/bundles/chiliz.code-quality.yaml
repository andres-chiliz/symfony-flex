      - phpmd.xml
      - phpstan.neon
      - rector.php
    makefile:
      - "-include vendor/chiliz/code-quality/make/code_quality.mk"
    composerCommands:
        "[ $COMPOSER_DEV_MODE -eq 0 ] ||  (mkdir -p .gitlab/merge_request_templates && cp vendor/chiliz/code-quality/.gitlab/merge_request_templates/Default.md .gitlab/merge_request_templates)": "script"
